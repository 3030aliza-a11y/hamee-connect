<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="logo.png">
<title>HAMEE Connect</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: cổng công khai dạng cột đơn mobile-first + khu Admin có tab bar đáy cho điện thoại */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --fg:#14202b; --muted:#5b6a78; --line:#dde3e9;
  --steel:#23287a; --steel-2:#2e3192; --copper:#d7191f; --copper-soft:#fde3e3;
  --ok:#1f8a5b; --ok-soft:#dff3ea; --warn:#b7791f; --warn-soft:#fbefd6; --bad:#c0392b; --bad-soft:#f9e0dd;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e161e; --surface:#16212c; --fg:#e6edf3; --muted:#93a3b2; --line:#26343f;
  --steel:#11143d; --steel-2:#2a2f86; --copper:#ff5a5f; --copper-soft:#3d1719;
  --ok:#4cc38a; --ok-soft:#173327; --warn:#e2b04a; --warn-soft:#3a2e14; --bad:#ef6b5b; --bad-soft:#3d1c18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e161e; --surface:#16212c; --fg:#e6edf3; --muted:#93a3b2; --line:#26343f;
  --steel:#11143d; --steel-2:#2a2f86; --copper:#ff5a5f; --copper-soft:#3d1719;
  --ok:#4cc38a; --ok-soft:#173327; --warn:#e2b04a; --warn-soft:#3a2e14; --bad:#ef6b5b; --bad-soft:#3d1c18; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0}
a{color:var(--copper)}
h1,h2,h3{font-family:var(--f-display);letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.1}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--copper)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--steel);color:#fff}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:56px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:#fff;font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.04em}
.logo .lg{width:38px;height:38px;flex:none}
.logo i{width:26px;height:26px;border-radius:6px;background:var(--copper);display:grid;place-items:center;font-style:normal;font-size:15px}
.nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.nav a{color:#cfdbe6;text-decoration:none;padding:8px 10px;border-radius:8px;white-space:nowrap;font-size:14px}
.nav a.on,.nav a:hover{color:#fff;background:rgba(255,255,255,.1)}
.nav a.adm{background:var(--copper);color:#fff}
@media (max-width:760px){.nav{display:none}.menu-btn{display:block!important}}
.menu-btn{display:none;margin-left:auto;background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:6px 10px}
.drawer{background:var(--steel);padding:8px 16px 14px;display:grid;gap:2px}
.drawer a{color:#e6edf3;text-decoration:none;padding:10px 4px;border-bottom:1px solid rgba(255,255,255,.08)}

/* hero */
.hero{background:linear-gradient(180deg,var(--steel) 0%,var(--steel-2) 100%);color:#fff;padding-block:40px 48px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 1px,transparent 1px 48px),repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 48px);pointer-events:none}
.hero .wrap{position:relative;z-index:1}
.hero h1{font-size:clamp(34px,7vw,60px);font-weight:800;text-transform:uppercase;margin-block:10px 14px}
.hero h1 span{color:var(--copper)}
.hero p{max-width:60ch;color:#cfdbe6;margin:0 0 22px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{border:0;border-radius:8px;padding:11px 18px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--copper);color:#fff}
.btn.ghost{background:transparent;color:inherit;border:1px solid currentColor}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.ok{background:var(--ok);color:#fff}.btn.bad{background:var(--bad-soft);color:var(--bad)}
.btn.line{background:var(--surface);border:1px solid var(--line);color:var(--fg)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:rgba(255,255,255,.15);border-radius:var(--r);overflow:hidden;margin-top:30px}
.stats div{background:rgba(10,24,36,.55);padding:14px}
.stats b{display:block;font-family:var(--f-display);font-size:30px;color:#fff}
.stats small{color:#a9bccc;font-size:12px}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}

section.blk{padding-block:36px}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.sec-h h2{font-size:30px;text-transform:uppercase}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}

/* sectors */
.sectors{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.sector{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:left;color:var(--fg)}
.sector:hover{border-color:var(--copper)}
.sector code{font-family:var(--f-mono);font-size:11px;color:var(--copper);background:var(--copper-soft);border-radius:4px;padding:2px 5px;flex:none}
.sector span{font-size:13.5px;font-weight:600;line-height:1.3}
.sector small{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:2px}

.news-item{display:flex;gap:12px}
.date{flex:none;width:52px;text-align:center;border:1px solid var(--line);border-radius:8px;padding:6px 0;background:var(--bg)}
.date b{display:block;font-family:var(--f-display);font-size:24px;line-height:1}
.date small{font-size:11px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--copper-soft);color:var(--copper)}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.n{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.avatar{width:42px;height:42px;border-radius:8px;background:var(--steel-2);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:17px;flex:none}
.row{display:flex;gap:10px;align-items:center;min-width:0}
.row>div{min-width:0}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.inp{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.filters .inp{flex:1 1 200px;width:auto}
label.f{display:grid;gap:4px;font-size:13px;font-weight:600}
form.stack{display:grid;gap:12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;color:var(--fg)}
.chip.on{background:var(--steel-2);color:#fff;border-color:var(--steel-2)}
.foot{background:var(--steel);color:#a9bccc;padding-block:28px;font-size:13px;margin-top:20px}
.foot b{color:#fff}
.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:99;max-width:calc(100% - 32px)}

/* ========== ADMIN ========== */
.adm-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--steel);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px}
.adm-top h1{font-size:22px;flex:1}
.adm-main{max-width:720px;margin:0 auto;padding:14px 16px calc(96px + env(safe-area-inset-bottom,0px))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{background:none;border:0;padding:8px 2px 9px;display:grid;justify-items:center;gap:2px;font-size:11px;color:var(--muted);position:relative}
.tabbar button svg{width:22px;height:22px}
.tabbar button.on{color:var(--copper)}
.badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:99px;font-size:10px;min-width:17px;padding:0 4px;line-height:17px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi small{color:var(--muted);font-size:12px}
.kpi b{display:block;font-family:var(--f-display);font-size:30px;line-height:1.1}
.kpi em{font-style:normal;font-size:12px;color:var(--ok)}
.task{display:flex;align-items:center;gap:10px;padding:12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:var(--r);text-align:left;width:100%;color:var(--fg)}
.task.bad{border-left-color:var(--bad)}.task.ok{border-left-color:var(--ok)}
.task b{font-family:var(--f-display);font-size:26px;min-width:34px}
.list{display:grid;gap:8px}
.li{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:8px}
.li .acts{display:flex;gap:6px;flex-wrap:wrap}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:12px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;padding:8px 10px;border-radius:8px;font-size:13px;white-space:nowrap;color:var(--muted)}
.seg button.on{background:var(--steel-2);color:#fff}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:31;width:54px;height:54px;border-radius:16px;border:0;background:var(--copper);color:#fff;font-size:28px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h3{font-size:24px;margin-bottom:12px}
.bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--copper)}
.sbars{display:grid;gap:7px}
.sbars .r{display:grid;grid-template-columns:1fr 34px;gap:8px;align-items:center;font-size:12.5px}
.login{max-width:360px;margin:12vh auto 0;padding-inline:16px}
.pin{font-family:var(--f-mono);font-size:28px;letter-spacing:.5em;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const d=s=>new Date(s+"T00:00:00");

  <div class="kpi"><small>Tin giao thương đang hiển thị</small><b class="num">${DB.trades.filter(t=>t.status==="live").length}</b></div>
 </div>
 ${next?`<h3 style="font-size:22px;margin:20px 0 8px">Sự kiện gần nhất</h3><div class="card"><div style="font-weight:600">${esc(next.title)}</div><div class="muted" style="font-size:13px">${fmt(next.date)} · ${esc(next.place)}</div><div class="row" style="margin-top:8px;justify-content:space-between"><span class="num" style="font-size:13px">${next.regs.length}/${next.cap} đăng ký · ${next.regs.filter(r=>r.checked).length} check-in</span><button class="btn sm line" data-go="events">Quản lý</button></div><div class="bar" style="margin-top:8px"><i style="width:${Math.min(100,next.regs.length/next.cap*100)}%"></i></div></div>`:""}
 <h3 style="font-size:22px;margin:20px 0 8px">Hội viên theo 14 nhóm ngành</h3>
 <div class="card sbars">${counts.map(([s,n])=>`<div class="r"><div><div style="display:flex;justify-content:space-between;gap:6px"><span class="ellip"><code style="font-family:var(--f-mono);color:var(--copper)">${s[0]}</code> ${s[1]}</span></div><div class="bar" style="margin-top:3px"><i style="width:${n/max*100}%"></i></div></div><b class="num" style="text-align:right">${n}</b></div>`).join("")}</div>
 <button class="btn line sm" id="reset" style="margin-top:20px">Khôi phục dữ liệu mẫu</button>`;
 el.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{if(b.dataset.s)admSeg.ap=b.dataset.s;if(b.dataset.f)admSeg.mf=b.dataset.f;admTab=b.dataset.go;renderAdmin()});
 $("#reset").onclick=()=>{const b=$("#reset");if(b.dataset.c){DB=JSON.parse(JSON.stringify(SEED));save();toast("Đã khôi phục dữ liệu mẫu");renderAdmin()}else{b.dataset.c=1;b.textContent="Chạm lần nữa để xác nhận khôi phục"}};
}
function aApprove(el){
 const [cur,s]=seg("ap",[["app",`Hội viên (${DB.applications.filter(a=>a.status==="pending").length})`],["trade",`Giao thương (${DB.trades.filter(t=>t.status==="pending").length})`],["done","Đã xử lý"]],"app");
 let html=s;
 if(cur==="app"){const l=DB.applications.filter(a=>a.status==="pending");html+=l.length?`<div class="list">${l.map(a=>`<div class="li"><div class="row"><div class="avatar">${esc(ini(a.name))}</div><div style="flex:1"><div style="font-weight:600">${esc(a.name)}</div><div class="muted" style="font-size:12.5px">Nhóm ${sec(a.sector)[0]} · ${esc(sec(a.sector)[1])}</div></div></div><div style="font-size:13px">${esc(a.rep)} · <span class="num">${esc(a.phone)}</span>${a.email?" · "+esc(a.email):""}<br><span class="muted">Gửi ngày ${fmt(a.date)}</span></div><div class="acts"><button class="btn ok sm" data-a="ok" data-id="${a.id}">Duyệt kết nạp</button><button class="btn bad sm" data-a="no" data-id="${a.id}">Từ chối</button><button class="btn line sm" data-copy="${esc(a.phone)}">Chép SĐT</button></div></div>`).join("")}</div>`:'<div class="empty">Không còn hồ sơ chờ duyệt.</div>'}
 else if(cur==="trade"){const l=DB.trades.filter(t=>t.status==="pending");html+=l.length?`<div class="list">${l.map(t=>`<div class="li">${tradeCard(t).replace('class="card"','')}<div class="acts"><button class="btn ok sm" data-t="live" data-id="${t.id}">Duyệt hiển thị</button><button class="btn bad sm" data-t="rejected" data-id="${t.id}">Từ chối</button></div></div>`).join("")}</div>`:'<div class="empty">Không còn tin chờ duyệt.</div>'}
 else{const l=[...DB.applications.filter(a=>a.status!=="pending").map(a=>({t:a.name,k:"Hồ sơ",s:a.status})),...DB.trades.filter(t=>t.status!=="pending").map(t=>({t:t.title,k:"Giao thương",s:t.status}))];html+=`<div class="list">${l.map(x=>`<div class="li"><div class="row" style="justify-content:space-between"><span class="muted" style="font-size:12px">${x.k}</span><span class="pill ${x.s==="rejected"?"bad":"ok"}">${x.s==="rejected"?"Từ chối":"Đã duyệt"}</span></div><div style="font-size:14px">${esc(x.t)}</div></div>`).join("")}</div>`}
 el.innerHTML=html;bindSeg();
 el.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{const a=DB.applications.find(x=>x.id==b.dataset.id);a.status=b.dataset.a==="ok"?"approved":"rejected";if(a.status==="approved"){const t=new Date();DB.members.push({id:nid(),name:a.name,sector:a.sector,city:"TP.HCM",rep:a.rep,phone:a.phone,joined:t.toISOString().slice(0,10),fee:"due",bday:"",status:"active"})}save();toast(a.status==="approved"?"Đã kết nạp hội viên mới":"Đã từ chối hồ sơ");renderAdmin()});
 el.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{const t=DB.trades.find(x=>x.id==b.dataset.id);t.status=b.dataset.t;save();toast(t.status==="live"?"Đã hiển thị trên bảng tin":"Đã từ chối tin");renderAdmin()});
 el.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>{navigator.clipboard?.writeText(b.dataset.copy).then(()=>toast("Đã chép "+b.dataset.copy),()=>toast(b.dataset.copy))});
}
function aMembers(el){
 const [cur,s]=seg("mf",[["all","Tất cả"],["paid","Đã đóng phí"],["due","Chưa đóng"],["overdue","Quá hạn"]],"all");
 const q=(admSeg.mq||"").toLowerCase();
 const l=DB.members.filter(m=>m.status==="active"&&(cur==="all"||m.fee===cur)&&(!q||m.name.toLowerCase().includes(q)||m.rep.toLowerCase().includes(q)));
 const FEE={paid:["ok","Đã đóng 2026"],due:["warn","Chưa đóng"],overdue:["bad","Quá hạn"]};
 el.innerHTML=`<input class="inp" id="mq" placeholder="Tìm doanh nghiệp hoặc người đại diện" value="${esc(admSeg.mq||"")}" style="margin-bottom:10px">${s}<p class="muted num" style="font-size:13px;margin:0 0 8px">${l.length} hội viên</p>
 <div class="list">${l.map(m=>`<div class="li"><div class="row"><div class="avatar">${esc(ini(m.name))}</div><div style="flex:1"><div style="font-weight:600">${esc(m.name)}</div><div class="muted" style="font-size:12.5px">${esc(m.rep)} · <span class="num">${esc(m.phone)}</span></div></div></div><div class="row" style="justify-content:space-between;flex-wrap:wrap"><span class="pill ${FEE[m.fee][0]}">${FEE[m.fee][1]}</span><span class="muted" style="font-size:12px">Nhóm ${sec(m.sector)[0]} · từ ${fmt(m.joined).slice(-4)}</span></div><div class="acts">${m.fee!=="paid"?`<button class="btn ok sm" data-paid="${m.id}">Ghi nhận đã đóng phí</button><button class="btn line sm" data-copy="${esc(m.phone)}">Chép SĐT nhắc phí</button>`:`<button class="btn line sm" data-edit="${m.id}">Sửa thông tin</button>`}</div></div>`).join("")||'<div class="empty">Không có hội viên phù hợp.</div>'}</div>
 <button class="fab" id="addM" aria-label="Thêm hội viên">+</button>`;
 bindSeg();
 const mq=$("#mq");mq.oninput=()=>{admSeg.mq=mq.value;const p=mq.selectionStart;renderAdmin();const n=$("#mq");n.focus();n.setSelectionRange(p,p)};
 el.querySelectorAll("[data-paid]").forEach(b=>b.onclick=()=>{DB.members.find(x=>x.id==b.dataset.paid).fee="paid";save();toast("Đã ghi nhận hội phí");renderAdmin()});
 el.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>{navigator.clipboard?.writeText(b.dataset.copy).then(()=>toast("Đã chép "+b.dataset.copy),()=>toast(b.dataset.copy))});
 const form=(m)=>`<h3>${m?"Sửa hội viên":"Thêm hội viên"}</h3><form class="stack" id="mf"><label class="f">Tên doanh nghiệp<input class="inp" id="m_name" required value="${esc(m?.name)}"></label><label class="f">Nhóm ngành<select class="inp" id="m_sector">${SECTORS.map(s=>`<option value="${s[0]}" ${m?.sector===s[0]?"selected":""}>${s[0]} · ${s[1]}</option>`).join("")}</select></label><label class="f">Người đại diện<input class="inp" id="m_rep" required value="${esc(m?.rep)}"></label><label class="f">Điện thoại<input class="inp" id="m_phone" value="${esc(m?.phone)}" inputmode="tel"></label><label class="f">Tỉnh/Thành<input class="inp" id="m_city" value="${esc(m?.city||"TP.HCM")}"></label><label class="f">Sinh nhật người đại diện (tháng-ngày)<input class="inp" id="m_bday" placeholder="10-25" value="${esc(m?.bday)}"></label><button class="btn pri">Lưu</button>${m?`<button type="button" class="btn bad" id="m_del">Ngừng hoạt động hội viên này</button>`:""}</form>`;
 const mount=m=>(bg,close)=>{bg.querySelector("#mf").onsubmit=e=>{e.preventDefault();const v={name:$("#m_name").value,sector:$("#m_sector").value,rep:$("#m_rep").value,phone:$("#m_phone").value,city:$("#m_city").value,bday:$("#m_bday").value};if(m)Object.assign(m,v);else DB.members.push({id:nid(),...v,joined:new Date().toISOString().slice(0,10),fee:"due",status:"active"});save();close();toast("Đã lưu");renderAdmin()};const del=bg.querySelector("#m_del");if(del)del.onclick=()=>{if(del.dataset.c){m.status="inactive";save();close();toast("Đã chuyển sang ngừng hoạt động");renderAdmin()}else{del.dataset.c=1;del.textContent="Chạm lần nữa để xác nhận"}}};
 $("#addM").onclick=()=>sheet(form(),mount());
 el.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{const m=DB.members.find(x=>x.id==b.dataset.edit);sheet(form(m),mount(m))});
}
function aEvents(el){
 const l=[...DB.events].sort((a,b)=>d(a.date)-d(b.date));
 el.innerHTML=`<div class="list">${l.map(e=>{const past=d(e.date)<today;return `<div class="li"><div class="row" style="justify-content:space-between"><span class="pill ${past?"n":"ok"}">${past?"Đã diễn ra":"Sắp diễn ra"}</span><span class="num muted" style="font-size:12.5px">${fmt(e.date)}</span></div><div style="font-weight:600">${esc(e.title)}</div><div class="muted" style="font-size:13px">📍 ${esc(e.place)}</div><div class="bar"><i style="width:${Math.min(100,e.regs.length/e.cap*100)}%"></i></div><div class="row" style="justify-content:space-between"><span class="num" style="font-size:13px">${e.regs.length}/${e.cap} đăng ký · ${e.regs.filter(r=>r.checked).length} check-in</span><button class="btn sm line" data-ev="${e.id}">Danh sách & check-in</button></div></div>`}).join("")}</div>
 <button class="fab" id="addE" aria-label="Tạo sự kiện">+</button>`;
 el.querySelectorAll("[data-ev]").forEach(b=>b.onclick=()=>openRegs(+b.dataset.ev));
 $("#addE").onclick=()=>sheet(`<h3>Tạo sự kiện</h3><form class="stack" id="ef"><label class="f">Tên sự kiện<input class="inp" id="e_title" required></label><label class="f">Ngày<input class="inp" id="e_date" type="date" required></label><label class="f">Địa điểm<input class="inp" id="e_place" required></label><label class="f">Số chỗ<input class="inp" id="e_cap" type="number" value="100" min="1"></label><label class="f" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="e_hot"> Gắn nhãn Hot Event</label><button class="btn pri">Đăng sự kiện</button></form>`,(bg,close)=>{bg.querySelector("#ef").onsubmit=ev=>{ev.preventDefault();DB.events.push({id:nid(),title:$("#e_title").value,date:$("#e_date").value,place:$("#e_place").value,cap:+$("#e_cap").value||100,hot:$("#e_hot").checked,regs:[]});save();close();toast("Đã đăng sự kiện lên web");renderAdmin()}});
}
function openRegs(id){const e=DB.events.find(x=>x.id===id);
 const body=()=>`<h3>${esc(e.title)}</h3><p class="muted num" style="margin-top:-6px">${e.regs.filter(r=>r.checked).length}/${e.regs.length} đã check-in</p>${e.regs.length?`<div class="list">${e.regs.map((r,i)=>`<label class="li" style="grid-template-columns:1fr auto;align-items:center"><div><div style="font-weight:600">${esc(r.name)}</div><div class="muted" style="font-size:12.5px">${esc(r.org)} · <span class="num">${esc(r.phone)}</span></div></div><input type="checkbox" data-ci="${i}" ${r.checked?"checked":""} style="width:24px;height:24px;accent-color:var(--copper)" aria-label="Check-in ${esc(r.name)}"></label>`).join("")}</div>`:'<div class="empty">Chưa có người đăng ký.</div>'}<button class="btn line" style="margin-top:12px;width:100%;justify-content:center" id="cl">Đóng</button>`;
 sheet(body(),(bg,close)=>{const bind=()=>{bg.querySelectorAll("[data-ci]").forEach(c=>c.onchange=()=>{e.regs[+c.dataset.ci].checked=c.checked;save();bg.querySelector(".sheet").innerHTML=body();bind()});bg.querySelector("#cl").onclick=()=>{close();renderAdmin()}};bind()})}
function aContent(el){
 const [cur,s]=seg("ct",[["news","Tin tức"],["trade","Giao thương"]],"news");
 let html=s;
 if(cur==="news")html+=`<div class="list">${DB.news.map(n=>`<div class="li"><div class="row" style="justify-content:space-between"><span class="tag">${esc(n.cat)}</span><span class="pill ${n.pub?"ok":"n"}">${n.pub?"Đang hiển thị":"Đã ẩn"}</span></div><div style="font-weight:600">${esc(n.title)}</div><div class="acts"><button class="btn line sm" data-np="${n.id}">${n.pub?"Ẩn khỏi web":"Hiển thị lại"}</button></div></div>`).join("")}</div><button class="fab" id="addN" aria-label="Viết tin">+</button>`;
 else html+=`<div class="list">${DB.trades.filter(t=>t.status==="live").map(t=>`<div class="li">${tradeCard(t).replace('class="card"','')}<div class="acts"><button class="btn bad sm" data-tr="${t.id}">Gỡ tin</button></div></div>`).join("")}</div>`;
 el.innerHTML=html;bindSeg();
 el.querySelectorAll("[data-np]").forEach(b=>b.onclick=()=>{const n=DB.news.find(x=>x.id==b.dataset.np);n.pub=!n.pub;save();toast(n.pub?"Đã hiển thị":"Đã ẩn");renderAdmin()});
 el.querySelectorAll("[data-tr]").forEach(b=>b.onclick=()=>{DB.trades.find(x=>x.id==b.dataset.tr).status="rejected";save();toast("Đã gỡ tin");renderAdmin()});
 const an=$("#addN");if(an)an.onclick=()=>sheet(`<h3>Viết tin</h3><form class="stack" id="nf"><label class="f">Tiêu đề<input class="inp" id="n_title" required></label><label class="f">Chuyên mục<select class="inp" id="n_cat"><option>Tin hoạt động</option><option>Tin chuyên ngành</option><option>Tin hội viên</option></select></label><button class="btn pri">Đăng tin</button></form>`,(bg,close)=>{bg.querySelector("#nf").onsubmit=e=>{e.preventDefault();DB.news.unshift({id:nid(),title:$("#n_title").value,cat:$("#n_cat").value,date:new Date().toISOString().slice(0,10),pub:true});save();close();toast("Đã đăng tin");renderAdmin()}});
}
render();
</script>
</body>
</html>
